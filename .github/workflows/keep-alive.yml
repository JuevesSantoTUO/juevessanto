name: Mantener vivo Supabase (La Madrugá)

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 08:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub con un clic

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer petición Keep-Alive a la API
        run: |
          curl -i -X GET '${{ secrets.SUPABASE_URL }}/rest/v1/newsletter?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
