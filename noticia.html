<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Actualidad - Jueves Santo Oviedo</title>

    <!-- Meta Etiquetas Open Graph / Facebook / WhatsApp (Inyección Estática Fallback) -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Jueves Santo Oviedo">
    <meta property="og:title" content="Noticias y Actualidad - Jueves Santo Oviedo">
    <meta property="og:description" content="Toda la información, comunicados oficiales y novedades del Jueves Santo en Oviedo.">
    <meta property="og:image" content="https://juevessantotuo.github.io/juevessanto/img/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Meta Etiquetas Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Noticias y Actualidad - Jueves Santo Oviedo">
    <meta name="twitter:description" content="Toda la información, comunicados oficiales y novedades del Jueves Santo en Oviedo.">
    <meta name="twitter:image" content="https://juevessantotuo.github.io/juevessanto/img/logo.png">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-client.js"></script>
</head>
<body>

    <div id="header-container"></div>

    <div class="contenedor-noticia-lectura">
        <div style="margin-bottom: 25px;">
            <a href="blog.html" class="btn-sutil-logout" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 8px 16px; font-size: 0.85rem;">
                ← Volver a Noticias
            </a>
        </div>

        <div id="noticia-loading" style="text-align: center; color: #888; padding: 60px 0;">
            Cargando contenido de la noticia...
        </div>

        <article id="noticia-article" style="display: none;">
            <header style="margin-bottom: 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;">
                    <span id="noticia-categoria" class="noticia-badge-cat">General</span>
                    <span id="noticia-fecha" style="color: var(--color-acento); font-size: 0.85rem; font-weight: bold; text-transform: uppercase;"></span>
                </div>
                <h1 id="noticia-titulo" style="color: #ffffff; font-size: 2.2rem; margin: 0 0 15px 0; line-height: 1.25; font-weight: bold;"></h1>
                <p id="noticia-autor" style="color: #aaaaaa; font-size: 0.9rem; margin-bottom: 12px;"></p>
                <div id="noticia-tags" class="noticia-tags-container"></div>
            </header>

            <div id="noticia-img-box" style="margin-bottom: 35px; display: none;">
                <img id="noticia-imagen" src="" alt="Noticia" style="width: 100%; max-height: 480px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.2);">
            </div>

            <!-- CUERPO DE LA NOTICIA -->
            <div id="noticia-cuerpo" class="noticia-body-rich"></div>

            <!-- BARRA DE INTERACCIÓN (LIKE Y COMPARTIR) -->
            <div class="noticia-social-bar">
                <button id="btn-like-noticia" class="btn-like-ui" onclick="toggleLikeNoticia()">
                    ❤️ <span id="like-count">0</span> Me gusta
                </button>

                <div class="share-buttons">
                    <span style="font-size: 0.8rem; color: #888;">Compartir:</span>
                    <button class="btn-share wa" onclick="compartirSocial('wa')" title="Compartir en WhatsApp">📱 WhatsApp</button>
                    <button class="btn-share fb" onclick="compartirSocial('fb')" title="Compartir en Facebook">📘 Facebook</button>
                    <button class="btn-share copy" onclick="copiarEnlaceNoticia()" title="Copiar enlace">🔗 Copiar</button>
                </div>
            </div>

            <!-- SECCIÓN DE COMENTARIOS -->
            <section class="seccion-comentarios">
                <h3 style="color: var(--color-acento); margin-bottom: 20px; font-size: 1.2rem;">💬 Comentarios (<span id="num-comentarios">0</span>)</h3>

                <div id="box-nuevo-comentario" style="margin-bottom: 30px;">
                    <form onsubmit="publicarComentario(event)">
                        <textarea id="txt-nuevo-comentario" rows="3" placeholder="Escribe tu comentario o apreciación sobre la noticia..." required style="width:100%; background:#141414; border:1px solid rgba(212,175,55,0.3); color:#fff; padding:12px; border-radius:6px; font-family:inherit; resize:vertical; box-sizing:border-box;"></textarea>
                        <div style="text-align: right; margin-top: 10px;">
                            <button type="submit" class="btn-tuna-ui" style="padding: 8px 18px; font-size: 0.85rem;">Publicar Comentario</button>
                        </div>
                    </form>
                </div>

                <div id="lista-comentarios">
                    <p style="color: #666; font-size: 0.9rem;">Cargando comentarios...</p>
                </div>
            </section>
        </article>
    </div>

    <div id="footer-container"></div>

    <script src="scripts/main.js"></script>
    <script src="scripts/noticia-detalle.js"></script>
</body>
</html>
