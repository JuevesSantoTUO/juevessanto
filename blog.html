<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog y Noticias - Jueves Santo Oviedo</title>

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-client.js"></script>
</head>
<body>

    <div id="header-container"></div>

    <main class="contenedor" style="margin-top: 30px; margin-bottom: 50px;">
        <section class="contador-container">
            <h2 class="titulo-pagina">📰 Noticias y Actualidad</h2>
            <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 30px;">
                Novedades oficiales, prensa y crónicas sobre la Madrugá de Oviedo.
            </p>

            <!-- GRID DE ARTÍCULOS DINÁMICOS -->
            <div id="blog-grid" class="blog-grid">
                <p style="text-align: center; color: #888; grid-column: 1/-1;">Cargando publicaciones...</p>
            </div>
        </section>
    </main>

    <!-- MODAL LECTOR DE NOTICIA COMPLETA -->
    <div id="modal-lectura-blog" class="modal-interno" style="display: none;">
        <div class="modal-contenido perfil-modal-box" style="max-width: 700px; text-align: left;">
            <button class="cerrar-modal" onclick="cerrarModalNoticia()">&times;</button>
            <span id="read-blog-fecha" style="color: var(--color-acento); font-size: 0.8rem; font-weight: bold;"></span>
            <h2 id="read-blog-titulo" style="color: #fff; margin: 10px 0 15px 0;"></h2>
            <p id="read-blog-autor" style="color: #888; font-size: 0.85rem; margin-bottom: 20px;"></p>
            <div id="read-blog-img-box" style="margin-bottom: 20px; display: none;">
                <img id="read-blog-img" src="" alt="Noticia" style="width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2);">
            </div>
            <div id="read-blog-contenido" class="blog-contenido-rich" style="color: #ddd; line-height: 1.7; font-size: 0.95rem;"></div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="scripts/main.js"></script>
    <script src="scripts/blog.js"></script>
</body>
</html>
