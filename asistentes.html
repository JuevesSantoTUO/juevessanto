<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistentes - Jueves Santo</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/asistentes.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <!-- CDN Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-client.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main class="contenedor">
        <h2 class="titulo-pagina">Asistentes 2026</h2>

        <div class="tabs-container">
            <button class="tab-btn activo" onclick="abrirPestaña(event, 'tunas')">Tunas</button>
            <button class="tab-btn" onclick="abrirPestaña(event, 'tunos')">Tunos</button>
        </div>

        <!-- PESTAÑA TUNAS: CARGA DINÁMICA DE TUNAS QUE HAN ASISTIDO -->
        <div id="tunas" class="tab-pane activo">
            <h3 class="subtitulo-seccion">Tunas Participantes</h3>
            <div id="grid-tunas-container" class="grid-tunas">
                <p style="text-align: center; color: #888; grid-column: 1 / -1;">Cargando tunas participantes...</p>
            </div>
        </div>

        <!-- PESTAÑA TUNOS: HALL OF FAME Y CENSO INTERACTIVO -->
        <div id="tunos" class="tab-pane">
            <h3 class="subtitulo-seccion">Censo Oficial y Hall of Fame de Tunos</h3>
            <p style="text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 20px;">
                Haz clic en el mote de cualquier tuno registrado para ver su perfil público, trayectoria y medallas.
            </p>

            <!-- BUSCADOR Y FILTROS DE TUNOS -->
            <div style="max-width: 500px; margin: 0 auto 20px auto; display: flex; gap: 10px;">
                <input type="text" id="buscar-tuno-input" placeholder="Buscar por mote, nombre o tuna..." oninput="filtrarTunosCenso()" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--color-acento); border-radius: 6px; color: #fff;">
            </div>

            <div class="tabla-contenedor">
                <table class="tabla-tunos">
                    <thead>
                        <tr>
                            <th style="text-align: center;">Mote / Tuno</th>
                            <th style="text-align: center;">Tuna de Origen</th>
                            <th style="text-align: center;">Medallas</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tunos-body">
                        <tr><td colspan="3" style="text-align: center; color: #888; padding: 25px;">Cargando censo de tunos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="scripts/main.js"></script>
    <script src="scripts/asistentes.js"></script>
</body>
</html>
